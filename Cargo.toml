[package]
name = "clock-rs"
version = "0.1.214"
authors = ["Oughie <oughery@gmail.com>"]
description = "A modern, terminal-based digital clock"
keywords = ["clock", "terminal", "time", "cli", "date"]
categories = ["date-and-time", "command-line-interface"]
exclude = ["public/*"]
repository = "https://github.com/Oughie/clock-rs"
homepage = "https://github.com/Oughie/clock-rs"
readme = "README.md"
license = "Apache-2.0"
edition = "2021"

[dependencies]
chrono = "0.4.39"
clap = { version = "4.5.27", features = ["derive"] }
crossterm = "0.28.1"
dirs = "6.0.0"
serde = { version = "1.0.217", features = ["derive"] }
toml = "0.8.19"

[build-dependencies]
clap = { version = "4.5.27", features = ["derive"] }
clap_complete = "4.5.32"
clap_mangen = "0.2.23"
serde = { version = "1.0.217", features = ["derive"] }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
